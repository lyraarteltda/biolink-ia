<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Link na Bio IA · Maestros da IA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0b12'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='none' stroke='%23ff4d5e' stroke-width='2'/%3E%3Ccircle cx='9.5' cy='7' r='1.3' fill='%23ffcf6b'/%3E%3Ccircle cx='16' cy='7' r='1.3' fill='%23ffcf6b'/%3E%3Ccircle cx='22.5' cy='7' r='1.3' fill='%23ffcf6b'/%3E%3C/svg%3E">
  <style>
    :root{--night:#0d0b12;--panel:#17141d;--line:#2b2733;--bulb:#ffcf6b;--accent:#ff4d5e;--ink:#f4efe6;--muted:#9a93a6;
      --cond:"Oswald","Arial Narrow","Roboto Condensed",system-ui,sans-serif}
    *{box-sizing:border-box;margin:0}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--night);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 420px at 50% -10%,rgba(255,207,107,.10),transparent 60%),linear-gradient(180deg,#0d0b12,#0a0810)}
    .bulbs{height:13px;background-image:radial-gradient(circle at center,#fff6df 0 1.4px,var(--bulb) 1.4px 2.4px,rgba(255,207,107,.5) 2.4px 3.6px,transparent 4.3px);background-size:21px 100%;background-repeat:repeat-x;background-position:center}
    .card{max-width:460px;width:100%;text-align:center;background:linear-gradient(180deg,#17141d,#1e1a25);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
    .inner{padding:34px 30px}
    .big{font-family:var(--cond);font-size:64px;font-weight:700;color:var(--bulb);text-shadow:0 0 18px rgba(255,207,107,.35);line-height:1}
    h1{font-family:var(--cond);text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:10px 0 8px;color:var(--ink)}
    p{color:var(--muted);margin-bottom:22px;font-size:14.5px}
    a.btn{display:inline-block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:13px 30px;background:linear-gradient(180deg,#ff7683,var(--accent));color:#fff;border-radius:11px;text-decoration:none;box-shadow:0 8px 22px rgba(255,77,94,.3)}
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="card">
    <div class="bulbs"></div>
    <div class="inner">
      <div class="big">404</div>
      <h1>Fora do ar</h1>
      <p>Esta página não está no letreiro. Volte para a ferramenta.</p>
      <a class="btn" href="/index.html">Voltar para Link na Bio IA</a>
    </div>
    <div class="bulbs"></div>
  </div>
</body>
</html>
